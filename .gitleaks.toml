title = "Custom Gitleaks Config - Terraform Secrets"

[extend]
useDefault = true

[[rules]]
id = "terraform-admin-password"
description = "Detect hardcoded Terraform admin_password"
regex = '''(?i)admin_password\s*=\s*"[^"]+"'''
tags = ["terraform", "password"]

[[rules]]
id = "terraform-generic-password"
description = "Detect hardcoded password/passwd/pwd variables in Terraform"
regex = '''(?i)(password|passwd|pwd)\s*=\s*"[^"]{4,}"'''
tags = ["terraform", "password"]

[[rules]]
id = "azure-client-secret"
description = "Detect Azure client_secret in provider or variable files"
regex = '''(?i)client_secret\s*=\s*"[^"]{8,}"'''
tags = ["azure", "secret"]

[[rules]]
id = "azure-subscription-id-hardcoded"
description = "Detect hardcoded Azure subscription_id"
regex = '''(?i)subscription_id\s*=\s*"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"'''
tags = ["azure", "subscription"]

[[rules]]
id = "azure-storage-connection-string"
description = "Detect Azure Storage Account connection string"
regex = '''DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{20,};?'''
tags = ["azure", "connection-string"]

[[rules]]
id = "azure-storage-account-key"
description = "Detect Azure Storage account_key / primary_access_key"
regex = '''(?i)(account_key|primary_access_key|secondary_access_key)\s*=\s*"[A-Za-z0-9+/=]{20,}"'''
tags = ["azure", "storage"]

[[rules]]
id = "aws-access-key-var"
description = "Detect AWS access key assigned in Terraform var/tfvars"
regex = '''(?i)(access_key|aws_access_key_id)\s*=\s*"AKIA[0-9A-Z]{16}"'''
tags = ["aws", "access-key"]

[[rules]]
id = "aws-secret-key-var"
description = "Detect AWS secret key assigned in Terraform var/tfvars"
regex = '''(?i)(secret_key|aws_secret_access_key)\s*=\s*"[A-Za-z0-9/+=]{40}"'''
tags = ["aws", "secret-key"]

[[rules]]
id = "generic-connection-string"
description = "Detect generic DB/connection strings with embedded credentials"
regex = '''(?i)(connection_string|conn_str|database_url)\s*=\s*"[^"]*:[^"]*@[^"]+"'''
tags = ["connection-string"]

[[rules]]
id = "terraform-api-token"
description = "Detect hardcoded api_key / api_token / access_token in Terraform files"
regex = '''(?i)(api_key|api_token|access_token)\s*=\s*"[A-Za-z0-9\-_\.]{16,}"'''
tags = ["terraform", "token"]

[[rules]]
id = "ssh-private-key-block"
description = "Detect embedded SSH/PEM private key blocks"
regex = '''-----BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY-----'''
tags = ["key", "ssh"]

[[rules]]
id = "terraform-sensitive-tfvars"
description = "Flag any secret-looking key inside .tfvars files"
regex = '''(?i)(secret|token|password|key)\s*=\s*"[^"]{6,}"'''
path = '''.*\.tfvars$'''
tags = ["terraform", "tfvars"]

[allowlist]
description = "Global allowlist for placeholders, examples, and non-sensitive paths"

paths = [
  '''\.terraform/.*''',
  '''\.terraform\.lock\.hcl''',
  '''terraform\.tfstate''',
  '''terraform\.tfstate\.backup''',
  '''gitleaks-report\.json''',
  '''\.git/.*''',
]

regexes = [
  '''(?i)(change[_-]?me|example|placeholder|dummy|test123|xxxxxxxx|<.*>)''',
  '''(?i)password\s*=\s*"(var\.|local\.|data\.)''',
]